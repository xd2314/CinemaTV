name: Bug report / 問題回報
description: Report reproducible behavior with scrubbed device details.
body:
  - type: checkboxes
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I removed IPs, serials, accounts, keys, backups and private receipts.
          required: true
        - label: I checked the compatibility and safety documentation.
          required: true
  - type: input
    attributes:
      label: Cinema TV source/APK version
    validations:
      required: true
  - type: input
    attributes:
      label: General device model and Android/API version (no identifiers)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Validation environment
      options: [Actual TV remote, Injected keys, Emulator, Robolectric/native preview, Build only]
  - type: textarea
    attributes:
      label: Scrubbed screenshot or minimal synthetic log
      description: No full logcat, partitions, media credentials or private boot assets.
